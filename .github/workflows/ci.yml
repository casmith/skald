name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t skald:ci .
      # The container must come up and answer before it is worth publishing.
      - name: Smoke test the image
        run: |
          docker run -d --name skald -p 8080:8080 \
            -e TRACKER_SERVERS="Testheim=http://127.0.0.1:1/status.json" skald:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo " ok"; exit 0; fi
            sleep 1
          done
          docker logs skald; exit 1
